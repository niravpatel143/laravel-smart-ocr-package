name: Bug Report
description: File a bug report
labels: ["bug"]
body:
  - type: input
    id: php-version
    attributes:
      label: PHP Version
      placeholder: "8.2"
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel Version
      placeholder: "11.x"
    validations:
      required: true
  - type: dropdown
    id: driver
    attributes:
      label: OCR Driver
      options: [tesseract, google, aws, azure, claude, openai, pdf, other]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Call SmartOCR::driver('x')->read($file)\n2. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true
  - type: textarea
    id: sample-file
    attributes:
      label: Sample File (optional)
      description: If possible, attach a sanitized sample file that triggers the issue.
